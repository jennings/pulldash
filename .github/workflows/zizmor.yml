name: Zizmor

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zizmor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install zizmor
        run: pip install zizmor
      - name: Check workflows
        run: zizmor .
